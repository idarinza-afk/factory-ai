[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "improvise"
version = "0.12.0"
description = "Local AI assistant for production line design, engineering calculations and documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "idarinza-afk" }]
dependencies = []

[project.optional-dependencies]
cad = ["ezdxf>=1.1"]
docs = ["openpyxl>=3.1", "python-docx>=1.1", "pypdf>=4"]
all = ["openpyxl>=3.1", "python-docx>=1.1", "pypdf>=4", "ezdxf>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
improvise = "improvise.cli:main"
factory-ai = "improvise.cli:main"  # old name, kept for compatibility

[tool.setuptools.packages.find]
include = ["improvise*"]

[tool.setuptools.package-data]
improvise = ["knowledge_base/*.md", "benchmarks/*.jsonl", "team_roles.json", "web_ui.html", "skill_library/*/SKILL.md"]
